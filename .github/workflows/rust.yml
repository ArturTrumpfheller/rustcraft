name: Rust checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install native Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev libvulkan-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Check original texture artifacts
        run: python tools/generate_textures.py --check
      - name: Independent v10 height fixtures
        run: python tools/terrain_v3_reference.py --check
      - name: Independent v11 density fixtures
        run: python tools/terrain_v4_reference.py --check
      - name: Independent v12 climate fixtures
        run: python tools/biome_v2_reference.py --check
      - name: Independent v13 terrain fixtures
        run: python tools/terrain_v5_reference.py --check
      - name: Cargo format
        run: cargo fmt --all -- --check
      - name: Cargo Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Cargo test
        shell: bash
        run: cargo test --locked --workspace -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/rustcraft-tests.log"
      - name: Test failure diagnostics
        if: failure()
        shell: python
        run: |
          import os
          from pathlib import Path
          log = Path(os.environ["RUNNER_TEMP"]) / "rustcraft-tests.log"
          if log.exists():
              text = log.read_text(encoding="utf-8", errors="replace")
              start = text.find("failures:")
              detail = text[start:] if start >= 0 else text[-12000:]
              detail = detail[:24000].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print("::error title=Workspace test failure::" + detail)
      - name: Cargo build
        run: cargo build --locked --workspace
      - name: Optimized AO regression
        run: cargo test --release --locked -p voxel_core mesh::ao_tests -- --test-threads=1
      - name: Optimized voxel processing regressions
        run: cargo test --release --locked -p voxel_core --lib
      - name: Optimized terrain and persistence integration
        run: cargo test --release --locked -p voxel_core --test terrain_v3 --test terrain_v4 --test terrain_v5 --test biome_v2 --test worldgen_integration --test worldgen_lifecycle
      - name: Optimized streaming and lifecycle regressions
        run: 'cargo test --release --locked -p rustcraft --bin rustcraft streaming:: -- --test-threads=1'
      - name: Optimized session regressions
        run: 'cargo test --release --locked -p rustcraft --bin rustcraft session:: -- --test-threads=1'
      - name: Optimized rendering regressions
        run: 'cargo test --release --locked -p rustcraft --bin rustcraft scene:: -- --test-threads=1'
      - name: Optimized F3 biome diagnostics
        run: 'cargo test --release --locked -p rustcraft --bin rustcraft debug_ui:: -- --test-threads=1'
      - name: Release workspace build
        run: cargo build --release --locked --workspace
